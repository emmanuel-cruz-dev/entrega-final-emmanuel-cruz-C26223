<section class="max-w-6xl mx-auto px-4 py-8">
  @if (featuredProducts().length > 0) {
  <p-carousel [slidesPerPage]="3" [spacing]="24" [loop]="true">
    <header class="text-center mb-8">
      <h2 class="text-2xl lg:text-4xl font-bold tracking-tight">Productos destacados</h2>
    </header>

    <p-carousel-content>
      @for (product of featuredProducts(); track product.id) {
      <p-carousel-item class="h-full">
        <app-product-card [product]="product" />
      </p-carousel-item>
      }
    </p-carousel-content>
    <div class="flex mt-4 gap-4">
      <p-carousel-indicators></p-carousel-indicators>
      <div class="flex items-center justify-end gap-2 flex-1">
        <button pCarouselPrev pButton severity="secondary" iconOnly>
          <svg data-p-icon="chevron-left"></svg>
        </button>
        <button pCarouselNext pButton severity="secondary" iconOnly>
          <svg data-p-icon="chevron-right"></svg>
        </button>
      </div>
    </div>
  </p-carousel>
  } @else {
  <div class="flex items-center justify-between mb-6">
    <h2 class="text-2xl font-bold tracking-tight">Productos destacados</h2>
  </div>
  <div
    class="text-center py-12 rounded-xl border border-dashed border-surface-300 dark:border-surface-700"
  >
    <p class="font-medium">No hay productos destacados por ahora.</p>
  </div>
  }
</section>

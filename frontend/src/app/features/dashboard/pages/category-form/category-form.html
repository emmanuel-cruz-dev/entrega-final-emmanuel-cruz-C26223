<section class="flex flex-col gap-6">
  <header class="flex items-center justify-between">
    <h1 class="text-2xl font-bold tracking-tight">
      {{ isEdit ? 'Editar categoría' : 'Nueva categoría' }}
    </h1>
    <a pButton routerLink="/dashboard/categories">
      <svg data-p-icon="arrow-left"></svg>
      <span>Volver a categorías</span>
    </a>
  </header>

  <form
    [formGroup]="form"
    (ngSubmit)="onSubmit()"
    class="flex flex-col gap-4 p-4 md:p-6 rounded-xl border border-surface-200 dark:border-surface-800"
  >
    <div class="flex flex-col gap-2">
      <label for="name" class="font-medium">Nombre</label>
      <input
        pInputText
        id="name"
        formControlName="name"
        placeholder="Ej. Indumentaria"
        maxlength="100"
        fluid
      />
      @if (hasError('name', 'required')) {
      <p-message severity="error" size="small" variant="simple"
        >El nombre es obligatorio.</p-message
      >
      } @if (hasError('name', 'maxlength')) {
      <p-message severity="error" size="small" variant="simple">Máximo 100 caracteres.</p-message>
      }
    </div>

    <div class="flex flex-col gap-2">
      <label for="description" class="font-medium"
        >Descripción <span class="text-surface-400 font-normal">(opcional)</span></label
      >
      <textarea
        pTextarea
        id="description"
        formControlName="description"
        placeholder="Descripción de la categoría..."
        rows="3"
        maxlength="500"
        fluid
      ></textarea>
      @if (hasError('description', 'maxlength')) {
      <p-message severity="error" size="small" variant="simple">Máximo 500 caracteres.</p-message>
      }
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <a pButton routerLink="/dashboard/categories" severity="secondary" outlined>Cancelar</a>
      <button pButton type="submit" [disabled]="saving() || loading()">
        {{ isEdit ? 'Guardar cambios' : 'Crear categoría' }}
      </button>
    </div>
  </form>
</section>

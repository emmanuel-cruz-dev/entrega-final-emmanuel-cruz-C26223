<section class="flex flex-col gap-6">
  <header class="flex items-center justify-between">
    <h1 class="text-2xl font-bold tracking-tight">Categorías</h1>
    <a pButton routerLink="/dashboard/products-categories/new">
      <svg data-p-icon="plus"></svg>
      <span>Nueva categoría</span>
    </a>
  </header>

  <p-table
    [value]="categories()"
    [paginator]="true"
    [rows]="10"
    [tableStyle]="{ 'min-width': '30rem' }"
  >
    <ng-template #header>
      <tr>
        <th>Nombre</th>
        <th>Descripción</th>
        <th class="text-right">Acciones</th>
      </tr>
    </ng-template>

    <ng-template #body let-category>
      <tr>
        <td class="font-medium">{{ category.name }}</td>
        <td class="text-surface-500 dark:text-surface-400">{{ category.description }}</td>
        <td>
          <div class="flex justify-end gap-2">
            <a
              pButton
              [routerLink]="['/dashboard/products-categories', category.id, 'edit']"
              severity="secondary"
              text
              size="small"
              iconOnly
              aria-label="Editar"
            >
              <svg data-p-icon="pencil"></svg>
            </a>
            <button
              pButton
              type="button"
              severity="danger"
              text
              size="small"
              iconOnly
              aria-label="Eliminar"
              (click)="onDelete(category)"
            >
              <svg data-p-icon="trash"></svg>
            </button>
          </div>
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="3" class="text-center! py-8!">No hay categorías para mostrar.</td>
      </tr>
    </ng-template>
  </p-table>

  <p-confirmdialog [style]="{ width: '460px' }" />
</section>

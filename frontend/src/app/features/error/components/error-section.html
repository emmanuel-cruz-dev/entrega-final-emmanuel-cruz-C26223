<section class="min-h-screen flex items-center justify-center px-6 py-16 bg-surface-950">
  <div class="flex flex-col items-center text-center gap-6 max-w-lg">
    <figure
      class="flex items-center justify-center w-28 h-28 rounded-full bg-primary/10 text-primary shadow-inner"
    >
      <svg [pIcon]="icon" size="40"></svg>
    </figure>

    <span
      class="px-3 py-1 text-xs font-bold tracking-widest uppercase rounded-full bg-primary/10 text-primary"
    >
      Error {{ code }}
    </span>

    <div class="flex flex-col gap-3">
      <h1
        class="text-2xl md:text-4xl font-extrabold tracking-tight text-surface-900 dark:text-surface-0"
      >
        {{ title }}
      </h1>
      <p class="text-surface-600 dark:text-surface-400 text-sm md:text-base leading-relaxed">
        {{ description }}
      </p>
    </div>

    <div class="pt-2">
      <a
        [routerLink]="link"
        pButton
        class="p-button-primary px-6 py-3 font-medium rounded-xl shadow-lg shadow-primary/25 transition-all duration-200 hover:scale-[1.02]"
      >
        <svg pIcon="arrow-left" size="14"></svg>
        {{ buttonText }}
      </a>
    </div>
  </div>
</section>

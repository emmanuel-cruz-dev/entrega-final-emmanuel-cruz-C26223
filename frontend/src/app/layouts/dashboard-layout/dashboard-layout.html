<div class="flex flex-col min-h-screen">
  <app-navbar />

  <p-sidebar-layout class="grow relative!">
    @if (isMobile() && open()) {
    <p-sidebar-backdrop class="absolute!" />
    }

    <p-sidebar
      id="dashboard-sidebar"
      [collapsible]="isMobile() ? 'offcanvas' : 'icon'"
      [overlay]="isMobile()"
      [(open)]="open"
    >
      <p-sidebar-spacer />
      <p-sidebar-aside>
        <p-sidebar-panel>
          <p-sidebar-content>
            <p-sidebar-group>
              <p-sidebar-group-label>Administración</p-sidebar-group-label>
              <p-sidebar-group-content>
                <p-sidebar-menu>
                  @for (item of navItems; track item.route) {
                  <p-sidebar-menu-item>
                    <a
                      pSidebarMenuButton
                      [routerLink]="item.route"
                      routerLinkActive
                      #rla="routerLinkActive"
                      [routerLinkActiveOptions]="{ exact: !!item.exact }"
                      [isActive]="rla.isActive"
                    >
                      <svg [pIcon]="item.icon"></svg>
                      <span>{{ item.label }}</span>
                    </a>
                  </p-sidebar-menu-item>
                  }
                </p-sidebar-menu>
              </p-sidebar-group-content>
            </p-sidebar-group>
          </p-sidebar-content>
          <button pSidebarRail></button>
        </p-sidebar-panel>
      </p-sidebar-aside>
    </p-sidebar>

    <p-sidebar-main>
      <header
        class="flex h-12 items-center gap-2 border-b border-surface-200 dark:border-surface-700 px-4"
      >
        <button
          pButton
          pSidebarTrigger
          target="dashboard-sidebar"
          severity="secondary"
          text
          size="small"
        >
          <svg data-p-icon="sidebar"></svg>
        </button>
      </header>

      <div class="flex-1 p-4">
        <router-outlet />
      </div>
    </p-sidebar-main>
  </p-sidebar-layout>

  <app-footer />
</div>

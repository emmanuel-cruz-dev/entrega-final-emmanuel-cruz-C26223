<p-menubar [model]="items" class="block border-l-0! border-r-0! rounded-none! py-2!">
  <ng-template #start>
    <a routerLink="/" class="flex items-center mr-4 text-xl font-bold tracking-tight"> Crud App </a>
  </ng-template>

  <ng-template #item let-item>
    <a
      pRipple
      [routerLink]="item.routerLink"
      routerLinkActive="text-primary font-semibold"
      [routerLinkActiveOptions]="{ exact: item.routerLink === '/' }"
      class="flex items-center px-3 py-2 gap-2 cursor-pointer"
    >
      <svg [pIcon]="item.icon"></svg>
      <span class="text-sm">{{ item.label }}</span>
    </a>
  </ng-template>
</p-menubar>

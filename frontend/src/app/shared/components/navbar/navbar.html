<p-menubar [model]="items" class="block border-l-0! border-r-0! rounded-none! py-3!">
  <ng-template #start>
    <a routerLink="/" class="flex items-center gap-2 mr-4 text-xl font-bold tracking-tight">
      <figure class="flex items-center justify-center w-8 h-8">
        <img
          src="catara-round-logo.avif"
          alt="Catara logo"
          class="w-full object-cover"
          width="600"
          height="600"
          loading="lazy"
        />
      </figure>
      Catara</a
    >
  </ng-template>

  <ng-template #item let-item>
    <a
      pRipple
      [routerLink]="item.routerLink"
      routerLinkActive="text-primary font-semibold"
      [routerLinkActiveOptions]="{ exact: item.routerLink === '/' }"
      class="flex items-center px-3 py-2 gap-2 cursor-pointer"
    >
      <svg [pIcon]="item.icon"></svg>
      <span class="text-sm">{{ item.label }}</span>
    </a>
  </ng-template>

  <ng-template #end>
    <app-product-search-bar class="hidden sm:block" />
  </ng-template>
</p-menubar>

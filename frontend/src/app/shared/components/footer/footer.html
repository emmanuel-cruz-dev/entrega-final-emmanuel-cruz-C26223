<footer
  class="bg-surface-50 dark:bg-surface-900 border-t border-surface-200 dark:border-surface-800"
>
  <div
    class="max-w-7xl mx-auto px-6 py-10 flex flex-col md:flex-row items-center justify-between gap-6"
  >
    <div class="text-center md:text-left space-y-2">
      <a
        routerLink="/"
        class="flex gap-2 items-center text-xl font-bold tracking-tight text-surface-900 dark:text-surface-0 hover:opacity-80 transition-opacity"
      >
        <figure class="flex items-center justify-center w-8 h-8">
          <img
            src="catara-round-logo.avif"
            alt="Catara logo"
            class="w-full object-cover"
            width="600"
            height="600"
            loading="lazy"
          />
        </figure>
        Catara
      </a>
      <p class="text-sm text-surface-500 dark:text-surface-400 max-w-sm">
        Explorá nuestro catálogo, descubrí nuevos productos y encontrá todo lo que buscás en un solo
        lugar.
      </p>
    </div>

    <nav class="flex items-center gap-8 text-sm font-medium">
      @for (item of items; track item.label) {
      <a
        [routerLink]="item.routerLink"
        class="text-surface-600 dark:text-surface-300 hover:text-primary transition-colors"
      >
        {{ item.label }}
      </a>
      }
    </nav>
  </div>

  <div class="border-t border-surface-200/60 dark:border-surface-800/60 py-4">
    <div class="max-w-7xl mx-auto px-6 text-xs text-surface-400 dark:text-surface-500">
      <p>
        © 2026 Catara. Proyecto desarrollado por
        <a
          href="https://emmanuel-cruz-dev.vercel.app/"
          class="hover:text-primary"
          target="_blank"
          rel="noopener noreferrer"
          title="Emmanuel Cruz portfolio"
          >Emmanuel Cruz</a
        >.
      </p>
    </div>
  </div>
</footer>
